name: Test and release

on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next
  workflow_dispatch:
    inputs:
      version:
        description: Existing unpublished version to recover
        required: true
      dist-tag:
        description: npm distribution tag
        required: true
        default: latest

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

      - name: Run tests
        run: pnpm test:all

      - name: Validate package
        run: pnpm test:package

      - name: Publish release
        if: github.event_name == 'push'
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Recover unpublished release
        if: github.event_name == 'workflow_dispatch'
        run: pnpm --dir lib publish --provenance --tag "$NPM_DIST_TAG" --no-git-checks
        env:
          NPM_DIST_TAG: ${{ inputs.dist-tag }}
